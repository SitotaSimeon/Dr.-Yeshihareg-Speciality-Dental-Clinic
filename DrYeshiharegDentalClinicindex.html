<style>
:root{--bg:#fff;--soft:#F5F8F7;--ink:#12324A;--mut:#4d6676;--em:#009B72;--dem:#006B50;--bl:#1677C8;--line:#dbe6e2;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1c27;--soft:#12283a;--ink:#eaf3f0;--mut:#a9bfc9;--line:#244257;--card:#12283a;color-scheme:dark}}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:Inter,'Noto Sans Ethiopic',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
a{color:inherit}.w{max-width:1100px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;line-height:1.1}
.logo small{display:block;font-weight:400;color:var(--em);font-size:.7rem;letter-spacing:.08em}
nav{display:none;gap:18px;font-size:.92rem}nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--em)}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;border:0;background:var(--em);color:#fff;font:600 1rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--dem);transform:translateY(-1px)}.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.wa{background:#1fa855}
.hero{background:linear-gradient(135deg,#006B50,#1677C8 130%);color:#fff;padding:56px 0 64px}
.hero h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.15;margin:0 0 14px;max-width:16ch}.hero p{max-width:52ch;opacity:.92;margin:0 0 24px}
.hero .row{display:flex;flex-wrap:wrap;gap:10px}.hero .btn.o{color:#fff;border-color:#ffffff88}
section{padding:48px 0}section.s{background:var(--soft)}h2{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 20px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px #0a2a3a0d}
.ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--em),var(--bl));margin-bottom:10px;display:grid;place-items:center;color:#fff;font-weight:700}
.br{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.br .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.br .btn{min-height:42px;padding:0 14px;font-size:.9rem}
.ph a{display:block;padding:6px 0;color:var(--bl);font-weight:600;text-decoration:none}
.ch{display:grid;gap:12px;grid-template-columns:1fr 1fr}.opt{cursor:pointer;text-align:left;font:inherit;color:inherit;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px}.opt[aria-pressed=true]{border-color:var(--em);background:#009B7214}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--em)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.err{color:#c0392b;font-size:.85rem;min-height:1em}.note{background:#1677C814;border-left:4px solid var(--bl);padding:10px 12px;border-radius:8px;font-size:.88rem;margin:14px 0}
.list{max-height:260px;overflow:auto;display:grid;gap:8px;margin-top:10px}.nav2{display:flex;gap:10px;margin-top:18px;justify-content:space-between}
footer{background:#12324A;color:#d6e4ea;padding:36px 0 90px;font-size:.9rem}footer a{color:#fff}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:#1fa855;color:#fff;display:grid;place-items:center;text-decoration:none;font-weight:700;box-shadow:0 6px 18px #0004;z-index:30}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:25}.sticky .btn{width:100%}

.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}.o1{width:300px;height:300px;background:#009B72;left:-80px;bottom:-100px}.o2{width:260px;height:260px;background:#1677C8;right:-60px;top:-60px}
.lc{background:#fff;border-radius:26px;padding:16px;box-shadow:0 30px 60px #0006,0 0 0 6px #ffffff22;max-width:420px;justify-self:center}.lc img{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.chips span{background:#ffffff1c;border:1px solid #ffffff33;backdrop-filter:blur(8px);padding:7px 13px;border-radius:99px;font-size:.85rem}.hero .btn.o{background:#ffffff14;backdrop-filter:blur(8px)}
h2:after{content:"";display:block;width:54px;height:3px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,var(--gold),var(--em))}

.ic{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#00b887,#1677C8);box-shadow:0 8px 18px #1677C84d}

.fl img{background:#fff;border-radius:12px;padding:6px;display:block}footer .sb{color:#12324A;background:#fff}
.fab svg{width:28px;height:28px}.fab{background:linear-gradient(135deg,#25D366,#128C4A)}

.av{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-weight:700;font-size:1.3rem;color:#fff;background:linear-gradient(135deg,var(--em),var(--bl))}
.gg{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.gt{aspect-ratio:4/3;position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s}.gt:hover{transform:scale(1.03)}.gt span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,#000b);color:#fff;font-size:.82rem;text-align:left}
.sb{cursor:pointer;font:inherit;color:inherit}.sb[aria-pressed=true]{background:var(--em);color:#fff;border-color:var(--em)}
#lb{position:fixed;inset:0;background:#000e;z-index:50;display:grid;place-items:center;padding:16px;align-content:center;gap:12px}#lb[hidden]{display:none}#lbi{width:min(92vw,760px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;cursor:zoom-in}#lbi svg{transition:transform .25s}#lbi.z svg{transform:scale(1.8)}#lbi.z{cursor:zoom-out}#lbc{color:#fff;text-align:center;max-width:600px;margin:0;font-size:.9rem}
.lbx,.lbn{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:1.6rem;cursor:pointer;z-index:2}.lbx{top:14px;right:14px}.lbn{top:50%}.lbn.l{left:8px}.lbn.r{right:8px}
.fd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:10px}.fd summary{cursor:pointer;font-weight:600;padding:12px 0}.fd p{margin:0 0 12px;color:var(--mut)}
.sph{display:grid;gap:22px;align-items:center}.spa{border-radius:24px;overflow:hidden;aspect-ratio:1/1;max-width:340px;width:100%;box-shadow:0 20px 44px #1677C844}.row2{display:flex;flex-wrap:wrap;gap:10px}
.mm{position:relative}.mm summary{list-style:none;cursor:pointer;font-size:1.5rem;padding:4px 10px;border:1px solid var(--line);border-radius:10px}.mm div{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;min-width:210px;box-shadow:0 14px 30px #0003}.mm a{padding:11px 14px;text-decoration:none}
#lang{margin-left:auto}@media(min-width:800px){.sph{grid-template-columns:340px 1fr}}@media(min-width:1180px){nav{display:flex}.mm{display:none}}

 if(st.step===0){h+=`<h3 style="margin-top:0">${t("q_branch")}</h3><div class="ch">${CONFIG.branches.map(x=>`<button class="opt" aria-pressed="${st.branch===x.id}" data-pb="${x.id}"><strong>${esc(bname(x.id))}</strong><br><small>${esc(x.addr)}</small></button>`).join("")}</div><div class="err">${e.branch||""}</div>`;nav=`<span></span><button class="btn" data-go="1">${t("next")}</button>`}
 if(st.step===1){const l=CONFIG.services.filter(s=>s.active&&T[L].s[s.id].toLowerCase().includes(st.q.toLowerCase()));h+=`<h3 style="margin-top:0">${t("q_service")}</h3><input id="sq" type="search" placeholder="${t("search")}" value="${esc(st.q)}" aria-label="${t("search")}"><div class="list">${l.map(s=>`<button class="opt" aria-pressed="${sv===s.id}" data-ps="${s.id}">${esc(T[L].s[s.id])}</button>`).join("")}</div><div class="err">${e.service||""}</div>`;nav=`<button class="btn o" data-go="0">${t("back")}</button><button class="btn" data-go="2">${t("next")}</button>`}
 if(st.step===2){h+=`<h3 style="margin-top:0">${esc(bname(st.branch))} · ${esc(T[L].s[sv])}</h3>`+[["name",t("name"),"text"],["phone",t("phone"),"tel"],["date",t("date"),"date"],["time",t("time"),"time"]].map(([k,lb,ty])=>`<label for="f_${k}">${lb}</label><input id="f_${k}" type="${ty}" data-f="${k}" value="${esc(f[k])}" ${k=="date"?'min="'+new Date().toISOString().slice(0,10)+'"':""} autocomplete="${k=="name"?"name":k=="phone"?"tel":"off"}"><div class="err">${e[k]||""}</div>`).join("")+`<label for="f_plang">${t("plang")}</label><select id="f_plang" data-f="plang" style="width:100%">${Object.entries(LN).map(([k,v])=>`<option value="${k}" ${(f.plang||L)===k?"selected":""}>${v}</option>`).join("")}</select><label for="f_msg">${t("msg")}</label><textarea id="f_msg" rows="3" maxlength="500" data-f="msg">${esc(f.msg)}</textarea>`;nav=`<button class="btn o" data-go="1">${t("back")}</button><button class="btn" data-go="3">${t("next")}</button>`}
 if(st.step===3){h+=`<h3 style="margin-top:0">${t("review")}</h3><p><b>${t("lblB")}:</b> ${esc(bname(st.branch))}<br><b>${t("lblA")}:</b> ${esc(b.addr)}<br><b>${t("lblS")}:</b> ${esc(T[L].s[sv])}<br><b>${t("name")}:</b> ${esc(f.name)}<br><b>${t("phone")}:</b> ${esc(f.phone)}<br><b>${t("date")}:</b> ${esc(f.date)} ${esc(f.time)}<br><b>${t("plang")}:</b> ${LN[f.plang||L]}${f.msg?`<br><b>${t("msg")}:</b> ${esc(f.msg)}`:""}</p><div class="note">${t("disc")}</div><div id="res" class="err" style="color:var(--dem)" role="status"></div>`;nav=`<button class="btn o" data-go="2">${t("back")}</button><button class="btn wa" id="send">${t("send")}</button>`}
 $("#wiz").innerHTML=h+`<div class="nav2">${nav}</div>`;
}
function validate(n){const f=st.f,e={};
 if(n>=1&&!st.branch){e.branch=t("req");return e}
 if(n>=2&&!st.service){e.service=t("req");return e}
 if(n>=3){if(!f.name.trim())e.name=t("req");if(!/^\+?[0-9 \-]{9,15}$/.test(f.phone.trim()))e.phone=t("badphone");
  if(!f.date)e.date=t("req");else if(f.date<new Date().toISOString().slice(0,10))e.date=t("baddate");if(!f.time)e.time=t("req")}
 return e}
function msgText(){const f=st.f,b=CONFIG.branches.find(x=>x.id===st.branch),pl=f.plang||L;
 return `${T[pl].tmpl}\n\n${T[pl].name}: ${f.name.trim()}\n${T[pl].lblB}: ${T[pl][b.id]}\n${T[pl].lblA}: ${b.addr}\n${T[pl].lblS}: ${T[pl].s[st.service]}\n${T[pl].date}: ${f.date}\n${T[pl].time}: ${f.time}\n${T[pl].phone}: ${f.phone.trim()}\n${T[pl].plang}: ${LN[pl]}${f.msg.trim()?`\n${T[pl].msg}: ${f.msg.trim()}`:""}\n\n${pl==="en"?"Thank you.":pl==="am"?"አመሰግናለሁ።":pl==="om"?"Galatoomaa.":"የቐንየልና።"}`}
function waUrl(){const n=CONFIG.whatsapp.replace(/\D/g,"");return n?`https://wa.me/${n}?text=${enc(msgText())}`:""}
document.addEventListener("click",ev=>{
 const c=ev.target.closest("[data-pb],[data-ps],[data-go],#send,.pick,[data-b]");if(!c)return;
 if(c.dataset.pb){st.branch=c.dataset.pb;st.err={};wiz()}
 else if(c.dataset.b){st.branch=c.dataset.b;st.step=Math.max(st.step,1)===3?3:1;st.err={};wiz()}
 else if(c.dataset.ps){st.service=c.dataset.ps;st.err={};wiz()}
 else if(c.classList.contains("pick")){st.service=c.dataset.s;if(st.step===0)st.step=0;wiz()}
 else if(c.dataset.go){const n=+c.dataset.go;if(n>st.step){const e=validate(n);if(Object.keys(e).length){st.err=e;wiz();return}}st.err={};st.step=n;wiz();$("#book").scrollIntoView()}
 else if(c.id==="send"){const u=waUrl();if(u){window.open(u,"_blank","noopener,noreferrer");$("#res").textContent=t("done")}else{navigator.clipboard&&navigator.clipboard.writeText(msgText()).catch(()=>{});$("#res").textContent=t("nowa")}}
});
document.addEventListener("input",ev=>{const k=ev.target.dataset.f;if(k)st.f[k]=ev.target.value;if(ev.target.id==="sq"){st.q=ev.target.value;const p=ev.target.selectionStart;wiz();const i=$("#sq");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("change",ev=>{const k=ev.target.dataset.f;if(k)st.f[k]=ev.target.value});
$("#lang").addEventListener("change",e=>{L=e.target.value;try{localStorage.setItem("lang",L)}catch(x){}render()});
const fab=$("#fab");fab.href="https://wa.me/"+CONFIG.whatsapp;fab.target="_blank";fab.rel="noopener noreferrer";fab.innerHTML=ICONS.wa;fab.removeAttribute("aria-hidden");//fab.addEventListener("click",()=>{const u=waUrl();if(u){fab.href=u;fab.target="_blank";fab.rel="noopener noreferrer"}});
document.body.insertAdjacentHTML("beforeend",'<div id="lb" hidden role="dialog" aria-modal="true"><button class="lbx" data-lb="x" aria-label="Close">✕</button><button class="lbn l" data-lb="p" aria-label="Previous">‹</button><div id="lbi"></div><button class="lbn r" data-lb="n" aria-label="Next">›</button><p id="lbc"></p></div>');
addEventListener("hashchange",route);
document.addEventListener("click",ev=>{const c=ev.target.closest("[data-gc],[data-gi],[data-lb],[data-fc],.mm a,#lbi");if(!c)return;
 if(c.dataset.gc){gs=c.dataset.gc;extra()}else if(c.dataset.gi)shot(+c.dataset.gi);else if(c.dataset.fc){fc.c=c.dataset.fc;extra()}
 else if(c.dataset.lb){c.dataset.lb==="x"?$("#lb").hidden=true:step(c.dataset.lb==="n"?1:-1)}
 else if(c.id==="lbi")c.classList.toggle("z");else $(".mm").open=false});
document.addEventListener("input",ev=>{if(ev.target.id==="fs"){fc.q=ev.target.value;fl()}});
document.addEventListener("keydown",ev=>{if($("#lb").hidden)return;if(ev.key==="Escape")$("#lb").hidden=true;if(ev.key==="ArrowRight")step(1);if(ev.key==="ArrowLeft")step(-1)});
let tx=0;$("#lb").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});$("#lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)step(d<0?1:-1)});
render();
</script></body></html>
